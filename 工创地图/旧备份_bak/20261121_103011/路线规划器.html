<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>工创小车 · 路线规划器（1cm 网格 · 可缩放）</title>
<style>
  :root{
    --bg:#1e1e2e; --panel:#282838; --line:#3a3a50; --fg:#e6e6f0; --dim:#9a9ab0;
    --ok:#4ade80; --bad:#f87171;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);
    font:13px/1.5 "Microsoft YaHei","Segoe UI",sans-serif;overflow:hidden}
  #app{display:flex;height:100%}
  #side{width:340px;min-width:340px;background:var(--panel);border-right:1px solid var(--line);
    display:flex;flex-direction:column;overflow:hidden}
  #side h1{font-size:15px;margin:0;padding:13px 16px 9px;border-bottom:1px solid var(--line)}
  #side h1 small{display:block;font-weight:400;color:var(--dim);font-size:11px;margin-top:4px}
  .sec{padding:11px 16px;border-bottom:1px solid var(--line)}
  .sec h2{font-size:12px;margin:0 0 8px;color:var(--dim);font-weight:600;letter-spacing:.5px}
  .row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  button{background:#34344a;color:var(--fg);border:1px solid var(--line);border-radius:6px;
    padding:6px 10px;cursor:pointer;font-size:12px}
  button:hover{background:#3f3f5a}
  button.primary{background:#2b5fa8;border-color:#3f7fd0}
  button.primary:hover{background:#3570c0}
  button.danger{background:#5a2b2b;border-color:#8a3a3a}
  input[type=number]{width:60px;background:#1b1b28;color:var(--fg);
    border:1px solid var(--line);border-radius:5px;padding:4px 6px;font-size:12px}
  .kv{display:flex;justify-content:space-between;padding:2px 0;color:var(--dim)}
  .kv b{color:var(--fg);font-weight:600}
  #segs{flex:1;overflow:auto;padding:0 16px 10px}
  #segs .item{display:flex;gap:8px;align-items:center;padding:5px 6px;border-radius:5px;font-size:11.5px}
  #segs .item:hover{background:#33334a}
  #segs .item.bad{background:#4a2626}
  #segs .idx{width:20px;height:20px;flex:0 0 20px;border-radius:50%;background:#3d5a80;
    display:flex;align-items:center;justify-content:center;font-size:10px}
  #segs .item.bad .idx{background:#a03232}
  #segs .txt{flex:1;color:var(--dim)}
  #segs .txt b{color:var(--fg)}
  #out{width:100%;height:110px;background:#15151f;color:#9ae6a0;border:1px solid var(--line);
    border-radius:6px;padding:8px;font:12px/1.5 Consolas,monospace;resize:vertical}
  #stage{flex:1;position:relative;background:#14141e;overflow:hidden}
  canvas{display:block;cursor:crosshair}
  #hud{position:absolute;left:12px;bottom:12px;background:rgba(20,20,30,.9);
    border:1px solid var(--line);border-radius:6px;padding:5px 10px;font-size:12px;color:var(--dim);
    pointer-events:none}
  #hud b{color:var(--fg)}
  #zoombar{position:absolute;right:12px;top:12px;display:flex;gap:6px;align-items:center}
  #zoombar button{padding:5px 9px;font-size:13px}
  #zpct{color:var(--dim);font-size:12px;min-width:44px;text-align:center}
  .tip{color:var(--dim);font-size:11px;line-height:1.7}
  kbd{background:#1b1b28;border:1px solid var(--line);border-radius:3px;padding:0 4px;font-size:10.5px}
</style>
</head>
<body>
<div id="app">
  <div id="side">
    <h1>工创小车 · 路线规划器
      <small>1cm 网格 ｜ 2400×2400mm ｜ 可缩放</small>
    </h1>

    <div class="sec">
      <h2>起点（48 格制，1 格=50mm）</h2>
      <div class="row">
        row <input type="number" id="sr" min="0" max="47" value="45">
        col <input type="number" id="sc" min="0" max="47" value="45">
        <button id="setStart">应用</button>
      </div>
      <div class="tip" style="margin-top:6px">车头默认朝地图上方（+y，90°）</div>
    </div>

    <div class="sec">
      <h2>操作</h2>
      <div class="row">
        <button id="undo">撤销</button>
        <button id="clear" class="danger">清空</button>
        <button id="snap">对齐 50mm</button>
        <button id="fit">适应窗口</button>
      </div>
      <div class="tip" style="margin-top:8px">
        <kbd>左键</kbd> 加航点（吸附 1cm）　<kbd>右键航点</kbd> 删除<br>
        <kbd>拖拽航点</kbd> 移动　<kbd>Shift+左键</kbd> 设为起点<br>
        <kbd>滚轮</kbd> 缩放（以光标为中心）　<kbd>中键拖动</kbd> 平移<br>
        <kbd>右键拖动</kbd> 也可平移　<kbd>右键单击</kbd> 删除航点
      </div>
    </div>

    <div class="sec">
      <h2>统计</h2>
      <div class="kv"><span>航点</span><b id="kWp">0</b></div>
      <div class="kv"><span>总路程</span><b id="kLen">0 mm</b></div>
      <div class="kv"><span>转向次数</span><b id="kTurn">0</b></div>
      <div class="kv"><span>合法性</span><b id="kOk">—</b></div>
    </div>

    <div class="sec"><h2>分段明细</h2></div>
    <div id="segs"><div class="tip" style="padding:0 16px">还没有航点。</div></div>

    <div class="sec">
      <h2>串口命令</h2>
      <textarea id="out" readonly></textarea>
      <div class="row" style="margin-top:8px">
        <button class="primary" id="copy">复制</button>
        <button id="save">导出 JSON</button>
        <button id="load">导入 JSON</button>
        <input type="file" id="file" accept=".json" style="display:none">
      </div>
    </div>
  </div>

  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="zoombar">
      <button id="zin">＋</button>
      <span id="zpct">100%</span>
      <button id="zout">－</button>
    </div>
    <div id="hud">格 <b id="hCell">—</b>　坐标 <b id="hMm">—</b>　50mm 格 <b id="hCell50">—</b></div>
  </div>
</div>

<script>
/* ================= 地图数据（与 AStar.c 一致） ================= */
const MAP = [
  "000000000000000000004444444400000000000000222222",
  "000000000000000000000444444000000000000000222222",
  "000000000000000000000000000000000000000000222222",
  "000000000000000000000000000000000000000000222222",
  "000000000000000000000000000000000000000000222222",
  "000000000000000000000000000000000000000000222222",
  "000000000000000000000000000000000000000000000000",
  "000000000000000000000000000000000000000000000000",
  "000000000000000000000000000000000000000000000000",
  "000000000000000000000000000000000000000000000000",
  "000000000000000000000000000000000000000000000000",
  "000000000001111111110000000011111111100000000000",
  "000000000001111111110000000011111111100000000000",
  "000000000001111111110000000011111111100000000000",
  "000000000001111111110000000011111111100000000000",
  "000000000001111111110000000011111111100000000000",
  "000000000001111111110000000011111111100000000000",
  "000000000001111111110000000011111111100000000000",
  "333000000001111111110000000011111111100000000000",
  "333000000001111111110000000011111111100000000000",
  "333000000000000000000000000000000000000000000000",
  "333000000000000000000000000000000000000000000005",
  "333000000000000000000000000000000000000000000005",
  "333000000000000000000000000000000000000000000005",
  "333000000000000000000000000000000000000000000005",
  "333000000000000000000000000000000000000000000005",
  "333000000000000000000000000000000000000000000005",
  "333000000000000000000000000000000000000000000000",
  "333000000001111111110000000011111111100000000000",
  "333000000001111111110000000011111111100000000000",
  "000000000001111111110000000011111111100000000000",
  "000000000001111111110000000011111111100000000000",
  "000000000001111111110000000011111111100000000000",
  "000000000001111111110000000011111111100000000000",
  "000000000001111111110000000011111111100000000000",
  "000000000001111111110000000011111111100000000000",
  "000000000001111111110000000011111111100000000000",
  "000000000000000000000000000000000000000000000000",
  "000000000000000000000000000000000000000000000000",
  "000000000000000000000000000000000000000000000000",
  "000000000000000000000000000000000000000000000000",
  "000000000000000000000000000000000000000000000000",
  "000000000000000000000000000000000000000000222222",
  "000000000000000000000000000000000000000000222222",
  "000000000000000000000000000000000000000000222222",
  "000000000000000000333333333333000000000000222222",
  "000000000000000000333333333333000000000000222222",
  "000000000000000000333333333333000000000000222222"
];
const N = 48, SUB = 5, N2 = N*SUB;      /* 48×48 / 240×240 */
const MAP_MM = 2400;
const BASE = 0.28;                      /* zoom=1 时 1mm = 0.28px（整图 672px） */

const KIND = MAP.map(s => s.split('').map(Number));
const DIST = Array.from({length:N},()=>new Array(N).fill(99));
{
  const q=[];
  for(let r=0;r<N;r++) for(let c=0;c<N;c++) if(KIND[r][c]===1){DIST[r][c]=0;q.push([r,c]);}
  let h=0;
  while(h<q.length){
    const [r,c]=q[h++];
    for(let dr=-1;dr<=1;dr++) for(let dc=-1;dc<=1;dc++){
      if(!dr&&!dc) continue;
      const nr=r+dr,nc=c+dc;
      if(nr<0||nr>=N||nc<0||nc>=N) continue;
      if(DIST[nr][nc]===99){DIST[nr][nc]=DIST[r][c]+1;q.push([nr,nc]);}
    }
  }
}
const CLEAR=4;
const FREE=Array.from({length:N},(_,r)=>Array.from({length:N},(_,c)=>
  (KIND[r][c]!==1&&KIND[r][c]!==3&&KIND[r][c]!==4&&KIND[r][c]!==5)&&DIST[r][c]>=CLEAR));

const c2mm=(r2,c2)=>({x:c2*10+5, y:(N2-1-r2)*10+5});
const mm2cell50=(x,y)=>({r:(N-1)-Math.floor(y/50), c:Math.floor(x/50)});
const cell2sub=(r,c)=>({r2:r*SUB+2, c2:c*SUB+2});

/* ================= 视图 ================= */
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
const stage=document.getElementById('stage');
let view={z:1, x:0, y:0};      /* x,y = 地图左上角在屏幕上的位置 */
let Wpx=800, Hpx=800;

function resize(){
  const r=stage.getBoundingClientRect();
  Wpx=Math.max(320,r.width); Hpx=Math.max(320,r.height);
  const DPR=window.devicePixelRatio||1;
  cv.width=Wpx*DPR; cv.height=Hpx*DPR;
  cv.style.width=Wpx+'px'; cv.style.height=Hpx+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  box();
  draw();
}
window.addEventListener('resize',resize);

/* mm -> 屏幕 */
const S=()=>BASE*view.z;
const sx=xmm=>view.x + xmm*S();
const sy=ymm=>view.y + (MAP_MM-ymm)*S();
const toWorld=(px,py)=>({x:(px-view.x)/S(), y:MAP_MM-(py-view.y)/S()});

function fit(){
  const pad=16;
  const z=Math.min((Wpx-pad*2)/(MAP_MM*BASE),(Hpx-pad*2)/(MAP_MM*BASE));
  view.z=z;
  view.x=(Wpx-MAP_MM*BASE*z)/2;
  view.y=(Hpx-MAP_MM*BASE*z)/2;
  box(); draw();
}
function zoomAt(px,py,factor){
  const w=toWorld(px,py);
  view.z=Math.max(0.3,Math.min(14,view.z*factor));
  view.x=px - w.x*S();
  view.y=py - (MAP_MM-w.y)*S();
  box(); draw();
}

/* ================= 状态 ================= */
let start=cell2sub(45,45);
let wps=[];
let hoverW=null, dragWp=-1, panning=false, panLast=null, rBtn=null, movedPx=0;

const C={floor:'#e9e9ef',obs:'#f6f0cf',start:'#3050e0',mat:'#ffffff',grab:'#f0a040',scan:'#3fc060'};

function box(){
  const x0=sx(0), y0=sy(MAP_MM);
  ctx.strokeStyle='#556'; ctx.lineWidth=2;
  ctx.strokeRect(x0,y0,MAP_MM*S(),MAP_MM*S());
}

function draw(){
  ctx.fillStyle='#14141e'; ctx.fillRect(0,0,Wpx,Hpx);
  const z=view.z, s=S();

  /* 可见范围（mm） */
  const wx0=Math.max(0,toWorld(0,0).x), wx1=Math.min(MAP_MM,toWorld(Wpx,0).x);
  const wy1=Math.min(MAP_MM,toWorld(0,0).y), wy0=Math.max(0,toWorld(0,Hpx).y);

  /* 底图 48×48 */
  const cs=50*BASE;                        /* 一格在 zoom=1 时的 px */
  for(let r=0;r<N;r++){
    const yTop=sy((N-r)*50), yBot=sy((N-1-r)*50);
    if(yBot<-40||yTop>Hpx+40) continue;
    for(let c=0;c<N;c++){
      const xL=sx(c*50), xR=sx((c+1)*50);
      if(xR<-40||xL>Wpx+40) continue;
      const k=KIND[r][c];
      ctx.fillStyle = k===1?C.obs:k===2?C.start:k===3?C.mat:k===4?C.grab:k===5?C.scan:C.floor;
      ctx.fillRect(xL,yTop,(xR-xL)+0.5,(yBot-yTop)+0.5);
      if(!FREE[r][c]){ ctx.fillStyle='rgba(20,20,35,.30)'; ctx.fillRect(xL,yTop,(xR-xL)+0.5,(yBot-yTop)+0.5); }
    }
  }

  /* 1cm 细网格：只在够宽时画 */
  const step10=BASE*10*z;
  if(step10>=5){
    ctx.strokeStyle='rgba(120,120,150,.18)'; ctx.lineWidth=1;
    ctx.beginPath();
    for(let mm=Math.floor(wx0/10)*10; mm<=wx1; mm+=10){
      const x=sx(mm); ctx.moveTo(x,sy(wy0)); ctx.lineTo(x,sy(wy1));
    }
    ctx.stroke();
    ctx.beginPath();
    for(let mm=Math.floor(wy0/10)*10; mm<=wy1; mm+=10){
      const y=sy(mm); ctx.moveTo(sx(wx0),y); ctx.lineTo(sx(wx1),y);
    }
    ctx.stroke();
  }
  /* 50mm 网格 */
  ctx.strokeStyle='rgba(150,150,175,.55)'; ctx.lineWidth=1;
  ctx.beginPath();
  for(let mm=Math.floor(wx0/50)*50; mm<=wx1; mm+=50){
    const x=sx(mm); ctx.moveTo(x,sy(wy0)); ctx.lineTo(x,sy(wy1));
  }
  for(let mm=Math.floor(wy0/50)*50; mm<=wy1; mm+=50){
    const y=sy(mm); ctx.moveTo(sx(wx0),y); ctx.lineTo(sx(wx1),y);
  }
  ctx.stroke();

  /* 区域标注（放大后才显示，避免挤） */
  if(z>=0.8){
    ctx.font='12px "Microsoft YaHei"'; ctx.textAlign='center'; ctx.textBaseline='middle';
    const lab=(r,c,t,col)=>{ ctx.fillStyle=col; ctx.fillText(t,sx(c*50+25),sy((N-1-r)*50+25)); };
    lab(3,45,'启停','rgba(255,255,255,.9)'); lab(45,45,'启停','rgba(255,255,255,.9)');
    lab(24,1.6,'物料','rgba(60,60,60,.75)'); lab(46,23.5,'物料','rgba(60,60,60,.75)');
    lab(1,23.5,'夹取','rgba(90,50,0,.85)'); lab(24,47,'扫码','rgba(255,255,255,.9)');
  }

  /* 路径 */
  const pts=[start,...wps], okArr=[];
  for(let i=1;i<pts.length;i++){
    const A=c2mm(pts[i-1].r2,pts[i-1].c2), B=c2mm(pts[i].r2,pts[i].c2);
    const ok=segOk(A,B); okArr.push(ok);
    ctx.strokeStyle=ok?'#1f6fd0':'#e03030'; ctx.lineWidth=2.5;
    ctx.beginPath(); ctx.moveTo(sx(A.x),sy(A.y)); ctx.lineTo(sx(B.x),sy(B.y)); ctx.stroke();
  }

  /* 起点 */
  {
    const m=c2mm(start.r2,start.c2), X=sx(m.x), Y=sy(m.y);
    ctx.beginPath(); ctx.arc(X,Y,7,0,7); ctx.fillStyle='#e03030'; ctx.fill();
    ctx.strokeStyle='#fff'; ctx.lineWidth=2; ctx.stroke();
    ctx.fillStyle='#fff'; ctx.font='bold 10px sans-serif'; ctx.fillText('S',X,Y+0.5);
  }
  /* 航点 */
  wps.forEach((p,i)=>{
    const m=c2mm(p.r2,p.c2), X=sx(m.x), Y=sy(m.y);
    const bad=(i>0)&&(okArr[i-1]===false);
    ctx.beginPath(); ctx.arc(X,Y,6.5,0,7);
    ctx.fillStyle=bad?'#e03030':'#1f6fd0'; ctx.fill();
    ctx.strokeStyle='#fff'; ctx.lineWidth=1.6; ctx.stroke();
    ctx.fillStyle='#fff'; ctx.font='bold 9px sans-serif'; ctx.fillText(String(i+1),X,Y+0.5);
  });

  /* 悬停光标格 */
  if(hoverW){
    const X=sx(Math.floor(hoverW.x/10)*10), Y=sy((Math.floor(hoverW.y/10)+1)*10);
    ctx.strokeStyle='rgba(77,163,255,.95)'; ctx.lineWidth=1.5;
    ctx.strokeRect(X,Y,10*S(),10*S());
  }

  /* 比例尺 */
  {
    const mm= z>=3?100:(z>=1.5?200:500);
    const px=mm*S();
    const bx=Wpx-px-24, by=Hpx-26;
    ctx.strokeStyle='#8a8aa0'; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.moveTo(bx,by); ctx.lineTo(bx+px,by);
    ctx.moveTo(bx,by-4); ctx.lineTo(bx,by+4);
    ctx.moveTo(bx+px,by-4); ctx.lineTo(bx+px,by+4); ctx.stroke();
    ctx.fillStyle='#8a8aa0'; ctx.font='10px Consolas,monospace'; ctx.textAlign='center';
    ctx.fillText(mm+'mm', bx+px/2, by-8);
  }

  document.getElementById('zpct').textContent=Math.round(view.z*100)+'%';
  updateSide(pts, okArr);
}

function segOk(A,B){
  const n=Math.max(Math.ceil(Math.hypot(B.x-A.x,B.y-A.y)/5),1);
  for(let i=0;i<=n;i++){
    const t=i/n, x=A.x+(B.x-A.x)*t, y=A.y+(B.y-A.y)*t;
    const q=mm2cell50(x,y);
    if(q.r<0||q.r>=N||q.c<0||q.c>=N||!FREE[q.r][q.c]) return false;
  }
  return true;
}
const heading=(A,B)=>Math.atan2(B.y-A.y,B.x-A.x)*180/Math.PI;
function dirText(a){
  const v=((a%360)+360)%360;
  if(Math.abs(v-0)<12||Math.abs(v-360)<12) return '→ 右';
  if(Math.abs(v-90)<12) return '↑ 上';
  if(Math.abs(v-180)<12) return '← 左';
  if(Math.abs(v-270)<12) return '↓ 下';
  return '斜 '+v.toFixed(0)+'°';
}

function updateSide(pts, okArr){
  document.getElementById('kWp').textContent=wps.length;
  let len=0,turns=0,allok=true,prev=null; const list=[];
  for(let i=1;i<pts.length;i++){
    const A=c2mm(pts[i-1].r2,pts[i-1].c2), B=c2mm(pts[i].r2,pts[i].c2);
    const d=Math.hypot(B.x-A.x,B.y-A.y), ang=heading(A,B), good=okArr[i-1];
    if(!good) allok=false;
    let tm='';
    if(prev!==null){ const dd=((ang-prev)%360+540)%360-180;
      if(Math.abs(dd)>15){turns++; tm=dd>0?' ↺':' ↻';} }
    prev=ang; len+=d;
    list.push({i,A,B,d,ang,good,tm});
  }
  document.getElementById('kLen').textContent=len.toFixed(0)+' mm';
  document.getElementById('kTurn').textContent=turns;
  const kOk=document.getElementById('kOk');
  if(pts.length<2){kOk.textContent='—';kOk.style.color='var(--dim)';}
  else if(allok){kOk.textContent='通过';kOk.style.color='var(--ok)';}
  else {kOk.textContent='穿障碍';kOk.style.color='var(--bad)';}

  const boxEl=document.getElementById('segs');
  if(!list.length){ boxEl.innerHTML='<div class="tip" style="padding:0 16px">还没有航点。</div>'; }
  else boxEl.innerHTML=list.map(s=>{
    const c50=mm2cell50(s.B.x,s.B.y);
    return `<div class="item ${s.good?'':'bad'}">
      <div class="idx">${s.i}</div>
      <div class="txt">(${s.B.x},${s.B.y})mm　格(${c50.r},${c50.c})<br>
      <b>${s.d.toFixed(0)}mm</b>　${dirText(s.ang)}${s.tm}　车头→<b>${s.ang.toFixed(0)}°</b>
      ${s.good?'':'　<span style="color:#f87171">穿障碍!</span>'}</div></div>`;
  }).join('');

  const out=wps.map(p=>{const m=c2mm(p.r2,p.c2);return `<<p ${m.x} ${m.y}>>`;}).join('\n');
  document.getElementById('out').value=out||'（先点几个航点）';
}

/* ================= 交互 ================= */
function evPos(e){
  const b=cv.getBoundingClientRect();
  return {px:e.clientX-b.left, py:e.clientY-b.top};
}
function nearWp(w){
  for(let i=0;i<wps.length;i++){
    const m=c2mm(wps[i].r2,wps[i].c2);
    if(Math.hypot(m.x-w.x,m.y-w.y)*S()<=9) return i;
  }
  const ms=c2mm(start.r2,start.c2);
  if(Math.hypot(ms.x-w.x,ms.y-w.y)*S()<=9) return -2;
  return -1;
}

cv.addEventListener('wheel',e=>{
  e.preventDefault();
  const p=evPos(e);
  zoomAt(p.px,p.py, e.deltaY<0?1.15:1/1.15);
},{passive:false});

cv.addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('auxclick',e=>e.preventDefault());   /* 阻止中键自动滚动/粘贴 */

cv.addEventListener('mousedown',e=>{
  const p=evPos(e), w=toWorld(p.px,p.py);
  movedPx=0;
  if(e.button===1){                          /* 中键: 平移地图 */
    e.preventDefault();
    panning=true; panLast={x:p.px,y:p.py};
    cv.style.cursor='grabbing';
    return;
  }
  if(e.button===2){                         /* 右键: 可能是平移, 也可能是删除 */
    rBtn={x:p.px,y:p.py,wx:w.x,wy:w.y};
    return;
  }
  if(e.button!==0) return;
  const i=nearWp(w);
  if(e.shiftKey){
    const c50=mm2cell50(w.x,w.y);
    start=cell2sub(Math.max(0,Math.min(47,c50.r)),Math.max(0,Math.min(47,c50.c)));
    draw(); return;
  }
  if(i>=0){ dragWp=i; return; }
  if(i===-2) return;
  /* 落点吸附到 1cm 格心 */
  const c2=Math.max(0,Math.min(N2-1,Math.floor(w.x/10)));
  const r2=Math.max(0,Math.min(N2-1,Math.floor((MAP_MM-w.y)/10)));
  wps.push({r2,c2}); draw();
});

cv.addEventListener('mousemove',e=>{
  const p=evPos(e), w=toWorld(p.px,p.py);
  hoverW=w;

  /* 中键拖动平移 */
  if(panning&&panLast){
    view.x+=p.px-panLast.x;
    view.y+=p.py-panLast.y;
    panLast={x:p.px,y:p.py};
    box(); draw(); return;
  }

  /* 右键拖动平移 */
  if(rBtn){
    const dx=p.px-rBtn.x, dy=p.py-rBtn.y;
    if(Math.abs(dx)+Math.abs(dy)>3){
      movedPx=Math.abs(dx)+Math.abs(dy);
      view.x+=dx; view.y+=dy;
      rBtn.x=p.px; rBtn.y=p.py;
      box(); draw();
      return;
    }
  }
  /* 拖拽航点 */
  if(dragWp>=0&&dragWp<wps.length){
    const c2=Math.max(0,Math.min(N2-1,Math.floor(w.x/10)));
    const r2=Math.max(0,Math.min(N2-1,Math.floor((MAP_MM-w.y)/10)));
    wps[dragWp]={r2,c2};
  }

  if(w.x>=0&&w.x<=MAP_MM&&w.y>=0&&w.y<=MAP_MM){
    const X=Math.max(0,Math.min(N2-1,Math.floor(w.x/10)));
    const Y=Math.max(0,Math.min(N2-1,Math.floor((MAP_MM-w.y)/10)));
    const m=c2mm(Y,X), c50=mm2cell50(m.x,m.y);
    document.getElementById('hCell').textContent=`(${Y},${X})`;
    document.getElementById('hMm').textContent=`(${m.x}, ${m.y}) mm`;
    document.getElementById('hCell50').textContent=`(${c50.r},${c50.c})`;
  }
  draw();
});

cv.addEventListener('mouseup',e=>{
  if(e.button===1){ panning=false; panLast=null; cv.style.cursor='crosshair'; draw(); return; }
  if(e.button===2&&rBtn){
    if(movedPx<=3){                        /* 没移动 = 删除 */
      const p=evPos(e), w=toWorld(p.px,p.py);
      const i=nearWp(w);
      if(i>=0){ wps.splice(i,1); }
    }
    rBtn=null; draw(); return;
  }
  dragWp=-1;
});
cv.addEventListener('mouseleave',()=>{ hoverW=null; dragWp=-1; rBtn=null; panning=false; panLast=null; cv.style.cursor='crosshair'; draw(); });

document.getElementById('zin').onclick=()=>zoomAt(Wpx/2,Hpx/2,1.3);
document.getElementById('zout').onclick=()=>zoomAt(Wpx/2,Hpx/2,1/1.3);
document.getElementById('fit').onclick=fit;

document.getElementById('undo').onclick=()=>{wps.pop();draw();};
document.getElementById('clear').onclick=()=>{wps=[];draw();};
document.getElementById('snap').onclick=()=>{
  const sn=p=>{const m=c2mm(p.r2,p.c2);const c=mm2cell50(m.x,m.y);return cell2sub(c.r,c.c);};
  start=sn(start); wps=wps.map(sn); draw();
};
document.getElementById('setStart').onclick=()=>{
  const r=clamp(+document.getElementById('sr').value), c=clamp(+document.getElementById('sc').value);
  start=cell2sub(r,c);
  document.getElementById('sr').value=r; document.getElementById('sc').value=c; draw();
};
function clamp(v){return Math.max(0,Math.min(47,isFinite(v)?Math.round(v):0));}

document.getElementById('copy').onclick=async()=>{
  const t=document.getElementById('out').value;
  try{await navigator.clipboard.writeText(t);}
  catch(e){const ta=document.getElementById('out');ta.select();document.execCommand('copy');}
  const b=document.getElementById('copy'),o=b.textContent;
  b.textContent='已复制'; setTimeout(()=>b.textContent=o,900);
};
document.getElementById('save').onclick=()=>{
  const data={start,wps};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='路线_'+new Date().toISOString().slice(0,16).replace(/[:T]/g,'')+'.json';
  a.click();
};
document.getElementById('load').onclick=()=>document.getElementById('file').click();
document.getElementById('file').onchange=e=>{
  const f=e.target.files[0]; if(!f) return;
  const rd=new FileReader();
  rd.onload=()=>{
    try{
      const d=JSON.parse(rd.result);
      if(d.start) start=(d.start.r2!==undefined)?d.start:cell2sub(d.start.r,d.start.c);
      wps=(d.wps||[]).map(p=>(p.r2!==undefined)?p:cell2sub(p.r,p.c));
      draw();
    }catch(err){alert('JSON 读不了：'+err);}
  };
  rd.readAsText(f);
};
document.addEventListener('keydown',e=>{
  if(e.key==='z'&&(e.ctrlKey||e.metaKey)){wps.pop();draw();e.preventDefault();}
  if(e.key==='Delete'){ if(wps.length){wps.pop();draw();e.preventDefault();} }
  if(e.key==='+'||e.key==='='){ zoomAt(Wpx/2,Hpx/2,1.3); }
  if(e.key==='-'){ zoomAt(Wpx/2,Hpx/2,1/1.3); }
});

resize(); fit();
</script>
</body>
</html>
